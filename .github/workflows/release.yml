name: Release

# 发布级 CI（两级中的第二级，见 docs/03-决策记录.md ADR-102）：
# 只在推送 v* 标签时运行，产出安装包并创建 **草稿** 预发布，不自动公开。
# 验证级 CI（pr.yml）负责分支/PR 的构建与回归；本 workflow 只做"把标签变成可下载产物"。
#
# 本地发布约定：打标签前先在本地把 CHANGELOG 切好、版本号同步好、commit 完；
# 标签一旦推上来即视为公开发布，必须通过 docs/06-发布政策.md 的门槛。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 发布构建不可半途而废：同一 tag 的重复推送不互相取消（与 pr.yml 相反）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # 与 pr.yml 同样要求 PowerShell 7：`>> $env:GITHUB_OUTPUT` 必须是 UTF-8
    shell: pwsh

jobs:
  build-release:
    name: Build installer and publish draft release
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@v4
        with:
          # tag 与版本一致性校验需要完整的标签上下文
          fetch-depth: 0

      - name: Resolve build paths
        id: paths
        run: |
          # 与 pr.yml 一致：vcpkg 安装根与二进制缓存都放在检出目录之外
          # （仓库路径含空格会触发 libmupdf 端口的 LNK1181，见 ADR-010）
          $root = Join-Path $env:RUNNER_TEMP 'lilith-reader'
          $install = Join-Path $root 'vcpkg-installed'
          $cache = Join-Path $root 'vcpkg-binary-cache'
          "VCPKG_INSTALL_ROOT=$install" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "cache=$cache" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pillow fonttools pymupdf

      - name: Locate Visual Studio and vcpkg
        id: tools
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found"
          }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "No Visual Studio installation with the C++ toolset was found"
          }

          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'
          $vcpkg = Join-Path $vsPath 'VC\vcpkg\vcpkg.exe'
          if (-not (Test-Path $msbuild)) { throw "MSBuild was not found at $msbuild" }
          if (-not (Test-Path $vcpkg)) { throw "vcpkg was not found at $vcpkg" }

          $toolset = 'v145'
          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          if (-not (Get-ChildItem $msvcRoot -Directory -Filter '14.5*' -ErrorAction SilentlyContinue)) {
            $toolset = 'v143'
          }

          "VS_PATH=$vsPath" >> $env:GITHUB_OUTPUT
          "MSBUILD=$msbuild" >> $env:GITHUB_OUTPUT
          "VCPKG=$vcpkg" >> $env:GITHUB_OUTPUT
          "TOOLSET=$toolset" >> $env:GITHUB_OUTPUT
          Write-Host "Visual Studio: $vsPath"
          Write-Host "MSBuild: $msbuild"
          Write-Host "vcpkg: $vcpkg"
          Write-Host "PlatformToolset: $toolset"

      - name: Enable user-wide vcpkg MSBuild integration
        run: |
          # 全新 runner 上没有 %LOCALAPPDATA%\vcpkg\vcpkg.user.props，缺了它经典
          # 集成不生效，构建直接 C1083（见 ADR-076 勘误）
          & '${{ steps.tools.outputs.VCPKG }}' integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integrate install failed with exit code $LASTEXITCODE" }

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ steps.paths.outputs.cache }}
          key: windows-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay-ports/**') }}
          restore-keys: |
            windows-vcpkg-

      - name: Install C++ dependencies
        run: |
          $manifestRoot = Join-Path $env:RUNNER_TEMP 'lilith-reader\manifest'
          New-Item -ItemType Directory -Force -Path $manifestRoot, $env:VCPKG_INSTALL_ROOT, $env:VCPKG_BINARY_CACHE | Out-Null

          $manifest = Get-Content "$env:GITHUB_WORKSPACE\vcpkg.json" -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName 'builtin-baseline' -NotePropertyValue 'a0400024711b283056538ac19ced80b91a83c24c' -Force
          $manifest | ConvertTo-Json -Depth 20 | Set-Content "$manifestRoot\vcpkg.json" -Encoding utf8

          Push-Location $manifestRoot
          try {
            & '${{ steps.tools.outputs.VCPKG }}' install `
              --x-install-root "$env:VCPKG_INSTALL_ROOT" `
              --triplet x64-windows-static `
              --overlay-ports "$env:GITHUB_WORKSPACE\overlay-ports" `
              --binarysource "clear;files,$env:VCPKG_BINARY_CACHE,readwrite"
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }

      - name: Verify tag matches declared version
        id: version
        run: |
          # 发布口径：tag `v<版本>` 必须与安装器与 exe 资源里的版本串一致，
          # 否则会出现"标签叫 rc.2、安装包叫 rc.1"这类不可追溯的事故。
          # 与 installer/LilithReader.iss 的编译期数字版本校验互补（那条只管 PE 数字版本）。
          $tag = "${{ github.ref_name }}"

          $iss = Get-Content "$env:GITHUB_WORKSPACE\installer\LilithReader.iss" -Raw
          if ($iss -notmatch '#define\s+MyAppVersion\s+"([^"]+)"') { throw "MyAppVersion not found in LilithReader.iss" }
          $issVersion = $Matches[1]

          $rc = Get-Content "$env:GITHUB_WORKSPACE\src\app\app.rc" -Raw
          if ($rc -notmatch 'VALUE\s+"ProductVersion",\s+"([^"]+)"') { throw "ProductVersion not found in app.rc" }
          $rcVersion = $Matches[1]

          Write-Host "tag=$tag  installer=$issVersion  app.rc=$rcVersion"
          if ("v$issVersion" -ne $tag) { throw "Tag '$tag' does not match installer version 'v$issVersion'" }
          if ($rcVersion -ne $issVersion) { throw "app.rc ProductVersion '$rcVersion' != installer MyAppVersion '$issVersion'" }

          "version=$issVersion" >> $env:GITHUB_OUTPUT

      - name: Build application
        run: |
          $vcpkgRoot = '${{ steps.tools.outputs.VS_PATH }}\VC\vcpkg'
          $installRoot = $env:VCPKG_INSTALL_ROOT
          & '${{ steps.tools.outputs.MSBUILD }}' `
            "$env:GITHUB_WORKSPACE\src\LilithReader.vcxproj" `
            /m `
            /nologo `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=${{ steps.tools.outputs.TOOLSET }} `
            /p:VcpkgEnableManifest=false `
            /p:VcpkgEnableClassic=true `
            "/p:VcpkgRoot=$vcpkgRoot" `
            "/p:VcpkgInstalledDir=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Run automated tests
        run: |
          # 发布级仍跑一遍全量回归：验证级只保证 PR 当时的绿色，tag 指向的确切提交
          # 必须自己再证明一次（tag 可指向任意历史提交）。
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\tests\run_tests.ps1" `
            -VcpkgRoot "$env:VCPKG_INSTALL_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Automated tests failed with exit code $LASTEXITCODE" }

      - name: Build installer
        run: |
          # 复用仓库自带打包脚本（ISCC 路径探测 + exe 存在检查都在里面）
          & "$env:GITHUB_WORKSPACE\installer\build_installer.bat"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }

      - name: Check installer size budget
        run: |
          & python "$env:GITHUB_WORKSPACE\tests\check_installer_size.py" `
            "$env:GITHUB_WORKSPACE\installer\dist"
          if ($LASTEXITCODE -ne 0) { throw "Installer size check failed" }

      - name: Stage release assets
        run: |
          $assets = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Get-ChildItem "$env:GITHUB_WORKSPACE\installer\dist\*.exe" | ForEach-Object {
            Copy-Item $_.FullName $assets
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content -Path (Join-Path $assets 'SHA256SUMS.txt') -Encoding ascii
          }
          Get-ChildItem $assets | Format-Table Name, Length -AutoSize

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $changelog = Get-Content "$env:GITHUB_WORKSPACE\CHANGELOG.md" -Raw
          $lines = $changelog -split "`r?`n"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($version))(\s|$)") { $start = $i + 1; break }
          }
          if ($start -lt 0) { throw "No CHANGELOG section for version $version" }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { break }
            $body += $lines[$i]
          }
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ($body -join "`n").Trim() | Set-Content $notes -Encoding utf8
          "file=$notes" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub release from existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --draft + --prerelease：不自动公开，由维护者复核后再手动发布
          # （安装包未做代码签名，见 docs/06-发布政策.md）
          gh release create "${{ github.ref_name }}" `
            release-assets/* `
            --verify-tag `
            --draft `
            --prerelease `
            --title "Lilith Reader ${{ steps.version.outputs.version }}" `
            --notes-file "${{ steps.notes.outputs.file }}"

      - name: Upload workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ steps.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
